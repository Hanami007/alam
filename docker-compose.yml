version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: alumni_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: alumni
      POSTGRES_PASSWORD: alumni_dev_password
      POSTGRES_DB: alumni_db
    ports:
      - "5435:5432"
    volumes:
      - alumni_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # เว็บดูข้อมูลในฐานข้อมูลผ่านเบราว์เซอร์ เข้าที่ http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: alumni_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  alumni_db_data: